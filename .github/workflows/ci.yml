name: Offline checks

on:
  push:
    branches: [main, develop, agent, 'feature/**']
  pull_request:
    branches: [main, develop, agent]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install current application dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python source
        run: python -m compileall -q rd app.py run_demo.py scripts tests evaluation legacy
      - name: Validate current data, tools, approvals and entry points
        run: python -m unittest discover -s tests -v
      - name: Generate local synthetic tables
        run: python scripts/generate_synthetic_data.py
      - name: Run scripted scenarios without AWS or a model
        run: |
          python run_demo.py syn_isolated --scripted
          python run_demo.py syn_quality --scripted
          python run_demo.py syn_fit --scripted
          python run_demo.py syn_damage --scripted
      - name: Verify preserved starter
        working-directory: legacy/starter
        run: |
          python -m unittest discover -s tests -v
          python -m return_detective.demo
