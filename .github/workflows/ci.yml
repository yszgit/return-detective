name: Offline checks

on:
  push:
    branches: [main, develop, agent, new-ui-code, 'feature/**']
  pull_request:
    branches: [main, develop, agent]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install current application dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python source
        run: python -m compileall -q rd app.py run_demo.py scripts tests evaluation
      - name: Validate complete official cleaned snapshot
        run: python scripts/validate_cleaned_data.py
      - name: Validate current data, tools, approvals and entry points
        run: python -m unittest discover -s tests -v
      - name: Run prepared real-data scenarios without AWS or a model
        env:
          RD_BACKEND: duckdb
          RD_DATA_DIR: data/cleaned
          RD_RUNTIME_DIR: runtime/cleaned-ci
        run: |
          python run_demo.py isolated --scripted
          python run_demo.py quality --scripted
          python run_demo.py fit --scripted
      - name: Generate local synthetic tables
        run: python scripts/generate_synthetic_data.py
      - name: Run scripted scenarios without AWS or a model
        run: |
          python run_demo.py syn_isolated --scripted
          python run_demo.py syn_quality --scripted
          python run_demo.py syn_fit --scripted
          python run_demo.py syn_damage --scripted
